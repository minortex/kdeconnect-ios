name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40
          echo "xckey=$(xcodebuild -version | head -1 | tr ' .' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache SPM + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            build/Build
          key: sim-${{ steps.xcode.outputs.xckey }}-${{ hashFiles('KDE Connect/**', 'KDE Connect.xcodeproj/**', 'Packages/**') }}
          restore-keys: |
            sim-${{ steps.xcode.outputs.xckey }}-

      - name: xcodebuild (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project 'KDE Connect.xcodeproj' \
            -scheme 'KDE Connect' \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  device-ipa:
    name: Unsigned device IPA
    runs-on: macos-26
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: xcode
        run: |
          xcodebuild -version
          echo "xckey=$(xcodebuild -version | head -1 | tr ' .' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache SPM + DerivedData
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            build/Build
          key: device-${{ steps.xcode.outputs.xckey }}-${{ hashFiles('KDE Connect/**', 'KDE Connect.xcodeproj/**', 'Packages/**') }}
          restore-keys: |
            device-${{ steps.xcode.outputs.xckey }}-

      - name: xcodebuild (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project 'KDE Connect.xcodeproj' \
            -scheme 'KDE Connect' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Fakesign with TrollStore entitlements (ldid)
        run: |
          set -euo pipefail
          brew install ldid
          APP='build/Build/Products/Release-iphoneos/KDE Connect.app'
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S.github/entitlements/trollstore.entitlements "$BIN"
          echo "== embedded entitlements =="
          ldid -e "$BIN" | tee /tmp/ents.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.multicast' /tmp/ents.plist
          /usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' /tmp/ents.plist

      - name: Verify it can run on iOS 17
        run: |
          APP='build/Build/Products/Release-iphoneos/KDE Connect.app'
          test -d "$APP"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          vtool -show-build "$BIN" | grep -A4 'platform IOS'
          minos=$(vtool -show-build "$BIN" | awk '/minos/ {print $2; exit}')
          major=${minos%%.*}
          echo "MinimumOS=$minos (major=$major)"
          if [ "$major" -gt 17 ]; then
            echo "::error::built with minimum iOS $minos - will NOT run on iOS 17"
            exit 1
          fi
          echo "OK: minimum iOS $minos <= 17.0"

      - name: Package unsigned IPA
        run: |
          APP='build/Build/Products/Release-iphoneos/KDE Connect.app'
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry kdeconnect-ios-unsigned.ipa Payload
          ls -lh kdeconnect-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-ios-unsigned-ipa
          path: kdeconnect-ios-unsigned.ipa
          if-no-files-found: error
